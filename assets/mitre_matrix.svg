    <rect x="12" y="14" width="70" height="20" rx="99" fill="#fb718522" stroke="#fb718566"/>
    <text x="47" y="28" fill="#fb7185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">T1052.001</text>
    <text x="168" y="28" fill="#fb7185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="end">Критический</text>

    <text x="14" y="52" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700">Эксфильтрация через</text>
