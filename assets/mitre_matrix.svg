    <text x="14" y="126" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Средний балл риска:</text>
    <text x="166" y="126" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">81 / 100</text>

    <text x="14" y="152" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Маркер: рост внешних</text>
    <text x="14" y="166" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">адресатов и вложений</text>
