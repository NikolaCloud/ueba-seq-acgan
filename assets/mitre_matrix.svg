    <text x="14" y="126" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Средний балл риска:</text>
    <text x="166" y="126" fill="#fb7185" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">89 / 100</text>

    <text x="14" y="152" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Маркер: скачок объема</text>
    <text x="14" y="166" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">обращений к файлам</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(580, 0)">
    <rect x="0" y="0" width="180" height="190" rx="12" fill="#0d1420" stroke="#253246" stroke-width="1.4"/>
    <rect x="12" y="14" width="55" height="20" rx="99" fill="#60a5fa22" stroke="#60a5fa66"/>
    <text x="39.5" y="28" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">T1048</text>
    <text x="168" y="28" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="end">Умеренный</text>

    <text x="14" y="52" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700">Скрытая эксфильтрация</text>
