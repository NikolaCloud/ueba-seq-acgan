    <text x="14" y="94" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Полнота выявления:</text>
    <text x="166" y="94" fill="#34d399" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">94,4%</text>

    <rect x="14" y="102" width="152" height="6" rx="3" fill="#1c2738"/>
    <rect x="14" y="102" width="143" height="6" rx="3" fill="url(#mGradRed)"/>

    <text x="14" y="126" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Средний балл риска:</text>
    <text x="166" y="126" fill="#fb7185" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">92 / 100</text>

    <text x="14" y="152" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Маркер: аномальный рост</text>
    <text x="14" y="166" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">USB-активности и файлов</text>
