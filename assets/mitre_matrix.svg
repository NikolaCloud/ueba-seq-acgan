    <text x="166" y="126" fill="#fbbf24" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">86 / 100</text>

    <text x="14" y="152" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Маркер: ночные сессии и</text>
    <text x="14" y="166" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">входы в выходные дни</text>
