    <text x="168" y="28" fill="#fbbf24" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="end">Высокий</text>

    <text x="14" y="52" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700">Несанкционированный</text>
