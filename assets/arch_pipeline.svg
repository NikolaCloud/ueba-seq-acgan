<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="pNorm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#0c1320" />
    </linearGradient>
    <linearGradient id="pGan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#201736" />
      <stop offset="100%" stop-color="#100b1e" />
    </linearGradient>
    <linearGradient id="pCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18253a" />
      <stop offset="100%" stop-color="#0f1724" />
    </linearGradient>
    <marker id="arrC2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrP2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <filter id="shP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Stage 1 -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="170" height="210" rx="14" fill="url(#pNorm)" stroke="#2b3b55" stroke-width="1.8" filter="url(#shP)"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#1b283d"/>
    <text x="85" y="22" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">1. ИСТОЧНИКИ ДАННЫХ</text>
    
    <rect x="12" y="44" width="146" height="48" rx="6" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="85" y="66" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Журналы событий</text>
    <text x="85" y="82" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle">Входы, USB, файлы, почта</text>

    <rect x="12" y="98" width="146" height="48" rx="6" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="85" y="120" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Штатные роли</text>
    <text x="85" y="136" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle">Каталоги должностей LDAP</text>

    <rect x="12" y="152" width="146" height="46" rx="6" fill="#12253b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="85" y="174" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Поток телеметрии</text>
    <text x="85" y="188" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" text-anchor="middle">Центральный сбор</text>
  </g>

  <path d="M 185 120 H 215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC2)"/>

  <!-- Stage 2 -->
  <g transform="translate(220, 15)">
    <rect x="0" y="0" width="170" height="210" rx="14" fill="url(#pNorm)" stroke="#2b3b55" stroke-width="1.8" filter="url(#shP)"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#1b283d"/>
    <text x="85" y="22" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">2. ВХОДНЫЕ ДАННЫЕ</text>
    
    <rect x="12" y="44" width="146" height="48" rx="8" fill="#0f1927" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="85" y="66" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Набор входных данных</text>
    <text x="85" y="82" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Временные интервалы</text>

    <rect x="12" y="98" width="146" height="48" rx="8" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="85" y="120" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Нормализация</text>
    <text x="85" y="136" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle">Масштабирование и шумы</text>

    <rect x="12" y="152" width="146" height="46" rx="8" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="85" y="174" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Векторы субъектов</text>
    <text x="85" y="188" fill="#2dd4bf" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Структурированный поток</text>
  </g>

  <path d="M 395 120 H 425" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrP2)"/>

  <!-- Stage 3 -->
  <g transform="translate(430, 15)">
    <rect x="0" y="0" width="170" height="210" rx="14" fill="url(#pGan)" stroke="#7c3aed" stroke-width="1.8" filter="url(#shP)"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#2d1b4e"/>
    <text x="85" y="22" fill="#c084fc" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">3. СИНТЕЗ УГРОЗ</text>
    
    <rect x="12" y="44" width="146" height="48" rx="6" fill="#1b122e" stroke="#a855f7" stroke-width="1"/>
    <text x="85" y="66" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Генератор нормы</text>
    <text x="85" y="82" fill="#d8b4fe" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle">Профили по штатным ролям</text>

    <rect x="12" y="98" width="146" height="48" rx="6" fill="#25121e" stroke="#f43f5e" stroke-width="1"/>
    <text x="85" y="120" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Инъекция атак</text>
    <text x="85" y="136" fill="#fda4af" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle">Сценарии MITRE ATT&amp;CK</text>

    <rect x="12" y="152" width="146" height="46" rx="6" fill="#131e2e" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="85" y="172" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Аугментация</text>
    <text x="85" y="189" fill="#2dd4bf" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">+104,8% PR-AUC</text>
  </g>

  <path d="M 605 120 H 635" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC2)"/>

  <!-- Stage 4 -->
  <g transform="translate(640, 15)">
    <rect x="0" y="0" width="170" height="210" rx="14" fill="url(#pNorm)" stroke="#0284c7" stroke-width="1.8" filter="url(#shP)"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#0c2338"/>
    <text x="85" y="22" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">4. ДЕТЕКТОР АНОМАЛИЙ</text>
    
    <rect x="12" y="44" width="146" height="48" rx="8" fill="#0b1726" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="85" y="66" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Градиентный бустинг</text>
    <text x="85" y="82" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Инференс 0,12 мс</text>

    <rect x="12" y="98" width="146" height="48" rx="8" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="85" y="120" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Вектор детекции</text>
    <text x="85" y="136" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">90 признаков</text>

    <rect x="12" y="152" width="146" height="46" rx="8" fill="#09131f" stroke="#22c55e" stroke-width="1.4"/>
    <text x="85" y="172" fill="#22c55e" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">PR-AUC: 0,891</text>
    <text x="85" y="188" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Recall: 88,8%</text>
  </g>

  <path d="M 815 120 H 845" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC2)"/>

  <!-- Stage 5 -->
  <g transform="translate(850, 15)">
    <rect x="0" y="0" width="140" height="210" rx="14" fill="url(#pNorm)" stroke="#2b3b55" stroke-width="1.8" filter="url(#shP)"/>
    <rect x="0" y="0" width="140" height="34" rx="14" fill="#1b283d"/>
    <text x="70" y="22" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">5. КОНТУР SOC</text>
    
    <rect x="10" y="44" width="120" height="48" rx="6" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="70" y="66" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Рейтинг риска</text>
    <text x="70" y="82" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Шкала 0 - 100</text>

    <rect x="10" y="98" width="120" height="48" rx="6" fill="url(#pCard)" stroke="#2d3d57" stroke-width="1"/>
    <text x="70" y="120" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Порог отсечки</text>
    <text x="70" y="136" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" text-anchor="middle">Калибровка баланса</text>

    <rect x="10" y="152" width="120" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="70" y="172" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Объяснимый ИИ</text>
    <text x="70" y="188" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Карточка события</text>
  </g>
</svg>
