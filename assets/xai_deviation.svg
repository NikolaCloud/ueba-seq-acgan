<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 185" width="760" height="185">
  <defs>
    <linearGradient id="barSigma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="185" rx="14" fill="#0c121d" stroke="#222f42" stroke-width="1.5"/>

  <text x="25" y="28" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700">Интерпретируемость решений: Декомпозиция факторов риска по σ-девиациям</text>
  <text x="25" y="45" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Каждое срабатывание сопровождается расчетом отклонений от индивидуального профиля нормы (μ ± σ)</text>

  <!-- Row 1: device_connect (+4.82 sigma) -->
  <text x="25" y="73" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600">Подключения съемных носителей информации</text>
  <text x="360" y="73" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">факт: 8 / норма: 0,1</text>
  <text x="735" y="73" fill="#fb7185" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">+4,82 σ (Критично)</text>
  <rect x="25" y="80" width="710" height="5" rx="2.5" fill="#1c2738"/>
  <rect x="25" y="80" width="640" height="5" rx="2.5" fill="url(#barSigma)"/>

  <!-- Row 2: file_events (+3.15 sigma) -->
  <text x="25" y="109" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600">Операции с файлами и документами</text>
  <text x="360" y="109" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">факт: 142 / норма: 18,4</text>
  <text x="735" y="109" fill="#fbbf24" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">+3,15 σ (Высоко)</text>
  <rect x="25" y="116" width="710" height="5" rx="2.5" fill="#1c2738"/>
  <rect x="25" y="116" width="460" height="5" rx="2.5" fill="url(#barSigma)"/>

  <!-- Row 3: after_hours (+2.40 sigma) -->
  <text x="25" y="145" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600">Активность во внерабочее время</text>
  <text x="360" y="145" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">факт: 26 / норма: 2,0</text>
  <text x="735" y="145" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">+2,40 σ (Умеренно)</text>
  <rect x="25" y="152" width="710" height="5" rx="2.5" fill="#1c2738"/>
  <rect x="25" y="152" width="350" height="5" rx="2.5" fill="url(#barSigma)"/>
</svg>
