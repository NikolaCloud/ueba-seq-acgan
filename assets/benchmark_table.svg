<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 670" width="1320" height="670">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="tblStatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f32" />
      <stop offset="100%" stop-color="#0b1320" />
    </linearGradient>
    <linearGradient id="tblRowGradMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102740" />
      <stop offset="100%" stop-color="#0b1928" />
    </linearGradient>
    <linearGradient id="tblRowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141d2c" />
      <stop offset="100%" stop-color="#0c121c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tblShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- NO ROOT BACKGROUND (Completely Transparent Canvas) -->

  <!-- ================= 4 TOP STAT CARDS ================= -->
  <g transform="translate(15, 15)">
    <!-- Stat 1: ТОЧНОСТЬ (бывший PR-AUC) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="305" height="125" rx="14" fill="url(#tblStatGrad)" stroke="#22334a" stroke-width="1.8" filter="url(#tblShadow)"/>
      <text x="22" y="34" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.04em">ТОЧНОСТЬ ДЕТЕКТОРА</text>
      <text x="22" y="82" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800">0,891</text>
      <text x="22" y="108" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5">Тестовая контрольная выборка</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(328, 0)">
      <rect x="0" y="0" width="305" height="125" rx="14" fill="url(#tblStatGrad)" stroke="#166534" stroke-width="1.8" filter="url(#tblShadow)"/>
      <text x="22" y="34" fill="#86efac" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.04em">ПОЛНОТА (ТОП-500)</text>
      <text x="22" y="82" fill="#22c55e" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800">88,8%</text>
      <text x="22" y="108" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5">Выявление 302 из 340 инцидентов</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(656, 0)">
      <rect x="0" y="0" width="305" height="125" rx="14" fill="url(#tblStatGrad)" stroke="#1e40af" stroke-width="1.8" filter="url(#tblShadow)"/>
      <text x="22" y="34" fill="#93c5fd" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.04em">ТОЧНОСТЬ (ТОП-100)</text>
      <text x="22" y="82" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800">100,0%</text>
      <text x="22" y="108" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5">Первые 100 оповещений без ошибок</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(984, 0)">
      <rect x="0" y="0" width="305" height="125" rx="14" fill="url(#tblStatGrad)" stroke="#0f766e" stroke-width="1.8" filter="url(#tblShadow)"/>
      <text x="22" y="34" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.04em">СКОРОСТЬ ОБРАБОТКИ</text>
      <text x="22" y="82" fill="#2dd4bf" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800">0,12 мс</text>
      <text x="22" y="108" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5">Время анализа одного окна</text>
    </g>
  </g>

  <!-- ================= TABLE HEADER ================= -->
  <g transform="translate(15, 158)">
    <rect x="0" y="0" width="1290" height="52" rx="12" fill="#111a28" stroke="#22334a" stroke-width="1.4"/>
    <text x="25" y="32" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.04em">МЕТОД / АЛГОРИТМ</text>
    <text x="460" y="32" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" letter-spacing="0.04em">ТОЧНОСТЬ</text>
    <text x="600" y="32" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" letter-spacing="0.04em">ПОЛНОТА</text>
    <text x="750" y="32" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" letter-spacing="0.04em">ТОЧНОСТЬ @100</text>
    <text x="900" y="32" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" letter-spacing="0.04em">ВРЕМЯ АНАЛИЗА</text>
    <text x="1135" y="32" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" letter-spacing="0.04em">НАЗНАЧЕНИЕ В СИСТЕМЕ</text>
  </g>

  <!-- ================= ROW 1: XGBOOST (MAIN DETECTOR) ================= -->
  <g transform="translate(15, 222)">
    <rect x="0" y="0" width="1290" height="78" rx="14" fill="url(#tblRowGradMain)" stroke="#0284c7" stroke-width="2" filter="url(#tblShadow)"/>
    
    <!-- Title Multi-line (without "90 признаков") -->
    <text x="25" y="34" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800">Градиентный бустинг</text>
    <text x="25" y="58" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700">Алгоритм XGBoost</text>
    
    <text x="460" y="47" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">0,891</text>
    <text x="600" y="47" fill="#22c55e" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">88,8%</text>
    <text x="750" y="47" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">100,0%</text>
    <text x="900" y="47" fill="#2dd4bf" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">0,12 мс</text>
    
    <!-- Badge -->
    <rect x="1010" y="19" width="250" height="40" rx="10" fill="#0369a1"/>
    <text x="1135" y="45" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Основной детектор</text>
  </g>

  <!-- ================= ROW 2: SEQ-ACGAN ================= -->
  <g transform="translate(15, 310)">
    <rect x="0" y="0" width="1290" height="78" rx="12" fill="url(#tblRowGrad)" stroke="#1e2c3e" stroke-width="1.2"/>
    
    <!-- Title Multi-line -->
    <text x="25" y="34" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="700">Дискриминатор Seq-ACGAN</text>
    <text x="25" y="58" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5">Сигнатурный анализ последовательностей</text>
    
    <text x="460" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,013</text>
    <text x="600" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3,1%</text>
    <text x="750" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2,0%</text>
    <text x="900" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1,45 мс</text>
    
    <!-- Badge -->
    <rect x="1010" y="19" width="250" height="40" rx="8" fill="#1e1834" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="1135" y="45" fill="#c084fc" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Классификатор атак</text>
  </g>

  <!-- ================= ROW 3: GANOMALY ================= -->
  <g transform="translate(15, 398)">
    <rect x="0" y="0" width="1290" height="78" rx="12" fill="url(#tblRowGrad)" stroke="#1e2c3e" stroke-width="1.2"/>
    
    <!-- Title Multi-line -->
    <text x="25" y="34" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="700">Автоэнкодер GANomaly</text>
    <text x="25" y="58" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5">Анализ ошибки реконструкции</text>
    
    <text x="460" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,019</text>
    <text x="600" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">14,2%</text>
    <text x="750" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2,0%</text>
    <text x="900" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2,10 мс</text>
    
    <!-- Badge -->
    <rect x="1010" y="19" width="250" height="40" rx="8" fill="#111e2e" stroke="#0284c7" stroke-width="1.2"/>
    <text x="1135" y="45" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Реконструкция нормы</text>
  </g>

  <!-- ================= ROW 4: ISOLATION FOREST ================= -->
  <g transform="translate(15, 486)">
    <rect x="0" y="0" width="1290" height="78" rx="12" fill="url(#tblRowGrad)" stroke="#1e2c3e" stroke-width="1.2"/>
    
    <!-- Title Multi-line -->
    <text x="25" y="34" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="700">Изолирующий лес</text>
    <text x="25" y="58" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5">Алгоритм Isolation Forest</text>
    
    <text x="460" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,011</text>
    <text x="600" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">9,4%</text>
    <text x="750" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1,0%</text>
    <text x="900" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,40 мс</text>
    
    <!-- Badge Multi-line -->
    <rect x="1010" y="16" width="250" height="46" rx="8" fill="#141c26" stroke="#475569" stroke-width="1.2"/>
    <text x="1135" y="35" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Базовый метод</text>
    <text x="1135" y="53" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" text-anchor="middle">Статистический эталон</text>
  </g>

  <!-- ================= ROW 5: ONE-CLASS SVM ================= -->
  <g transform="translate(15, 574)">
    <rect x="0" y="0" width="1290" height="78" rx="12" fill="url(#tblRowGrad)" stroke="#1e2c3e" stroke-width="1.2"/>
    
    <!-- Title Multi-line -->
    <text x="25" y="34" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="700">Метод опорных векторов</text>
    <text x="25" y="58" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5">Алгоритм One-Class SVM</text>
    
    <text x="460" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,008</text>
    <text x="600" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">8,1%</text>
    <text x="750" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,0%</text>
    <text x="900" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">0,85 мс</text>
    
    <!-- Badge Multi-line -->
    <rect x="1010" y="16" width="250" height="46" rx="8" fill="#141c26" stroke="#475569" stroke-width="1.2"/>
    <text x="1135" y="35" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Базовый метод</text>
    <text x="1135" y="53" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" text-anchor="middle">Классический эталон</text>
  </g>
</svg>
