<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="760" height="270" rx="14" fill="#0c121d" stroke="#222f42" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="25" y="28" fill="#edf3fb" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">Эффективность аугментации данных</text>
  <text x="25" y="46" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">Метрика PR-AUC при 1, 3, 5, 10, 15 и 20 обучающих примерах на сценарий</text>
  
  <!-- Legend in dedicated top-right zone -->
  <rect x="495" y="18" width="12" height="12" rx="3" fill="#475569"/>
  <text x="513" y="28" fill="#8d9aaf" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Без аугментации</text>

  <rect x="625" y="18" width="12" height="12" rx="3" fill="#5eead4"/>
  <text x="643" y="28" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600">С аугментацией</text>

  <!-- Axis & Gridlines -->
  <line x1="50" y1="218" x2="725" y2="218" stroke="#26354a" stroke-width="1.2"/>
  <line x1="50" y1="173" x2="725" y2="173" stroke="#1c2738" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="50" y1="128" x2="725" y2="128" stroke="#1c2738" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="50" y1="83" x2="725" y2="83" stroke="#1c2738" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="40" y="222" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="end">0.00</text>
  <text x="40" y="177" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="end">0.04</text>
  <text x="40" y="132" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="end">0.08</text>
  <text x="40" y="87" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="end">0.12</text>

  <!-- Bars 1: 1 shot -->
  <rect x="85" y="176" width="22" height="42" rx="4" fill="url(#baseGrad)"/>
  <rect x="110" y="167" width="22" height="51" rx="4" fill="url(#cyanGrad)"/>
  <text x="108" y="238" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1 прим.</text>
  <text x="121" y="160" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+23%</text>

  <!-- Bars 2: 3 shots -->
  <rect x="195" y="176" width="22" height="42" rx="4" fill="url(#baseGrad)"/>
  <rect x="220" y="141" width="22" height="77" rx="4" fill="url(#cyanGrad)"/>
  <text x="218" y="238" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3 прим.</text>
  <text x="231" y="134" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+84%</text>

  <!-- Bars 3: 5 shots -->
  <rect x="305" y="169" width="22" height="49" rx="4" fill="url(#baseGrad)"/>
  <rect x="330" y="143" width="22" height="75" rx="4" fill="url(#cyanGrad)"/>
  <text x="328" y="238" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">5 прим.</text>
  <text x="341" y="136" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+54%</text>

  <!-- Bars 4: 10 shots -->
  <rect x="415" y="163" width="22" height="55" rx="4" fill="url(#baseGrad)"/>
  <rect x="440" y="106" width="22" height="112" rx="4" fill="url(#cyanGrad)"/>
  <text x="438" y="238" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">10 прим.</text>
  <text x="451" y="98" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+105%</text>

  <!-- Bars 5: 15 shots -->
  <rect x="525" y="153" width="22" height="65" rx="4" fill="url(#baseGrad)"/>
  <rect x="550" y="108" width="22" height="110" rx="4" fill="url(#cyanGrad)"/>
  <text x="548" y="238" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">15 прим.</text>
  <text x="561" y="100" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+68%</text>

  <!-- Bars 6: 20 shots -->
  <rect x="635" y="138" width="22" height="80" rx="4" fill="url(#baseGrad)"/>
  <rect x="660" y="89" width="22" height="129" rx="4" fill="url(#cyanGrad)"/>
  <text x="658" y="238" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">20 прим.</text>
  <text x="671" y="81" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+62%</text>
</svg>
