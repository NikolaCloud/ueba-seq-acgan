<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнительный анализ и метрики качества · SVG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080d16;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 60px;
    }
    .print-bar {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }
    .print-btn {
      background: linear-gradient(100deg, #0284c7, #0f766e);
      color: #ffffff;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
    }
    .container {
      width: 1300px;
      max-width: 96vw;
      background: transparent;
      border: none;
      overflow: hidden;
    }
    .container img, .container svg {
      width: 100%;
      height: auto;
      display: block;
    }
    @media print {
      body {
        padding: 0;
        background: transparent;
      }
      .print-bar { display: none !important; }
      .container {
        width: 100%;
        max-width: none;
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="print-bar">
    <button class="print-btn" onclick="window.print()">🖨️ Печать / Сохранить в PDF</button>
  </div>
  <div class="container">
    <img src="assets/benchmark_table.svg" alt="Таблица сравнительного анализа и метрик качества">
  </div>
</body>
</html>
