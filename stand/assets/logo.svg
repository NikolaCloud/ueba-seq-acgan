<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0d1522" stroke="url(#logoGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="14 10" opacity="0.8"/>
  <line x1="50" y1="50" x2="80" y2="50" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" filter="url(#logoGlow)"/>
  <polygon points="50,36 62,50 50,64 38,50" fill="#5eead4" filter="url(#logoGlow)"/>
  <circle cx="50" cy="50" r="4.5" fill="#070a10"/>
  <circle cx="50" cy="50" r="2" fill="#ffffff"/>
</svg>
