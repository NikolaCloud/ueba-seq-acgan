[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ueba-seq-acgan"
version = "0.1.0"
description = "UEBA demonstration system based on a sequential ACGAN"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=16.0", "scikit-learn>=1.5", "joblib>=1.4", "torch>=2.4", "xgboost>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ueba-seq-acgan = "ueba_seq_acgan.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ueba_seq_acgan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
